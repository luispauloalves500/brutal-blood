name: Deploy BRUTAL BLOOD to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Actions as the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${{ github.repository }}/pages" -f build_type=workflow
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build static game
        env:
          VITE_GROK_EXTENSIONS: "0"
        run: |
          npm run build
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const file = "dist/index.html";
            const html = readFileSync(file, "utf8")
              .replaceAll("<link rel=\"manifest\" href=\"/__grok/manifest.webmanifest\">", "")
              .replaceAll("<link rel=\"apple-touch-icon\" href=\"/__grok/icon-180.png\">", "")
              .replaceAll(/<script src="https:\/\/grok\.com\/grok-app-builder\/extensions\.js"[^>]*><\/script>/g, "");
            if (html.includes("/__grok/") || html.includes("grok-app-builder")) {
              console.error("preview chrome still in dist/index.html");
              process.exit(1);
            }
            writeFileSync(file, html);
          '
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
